spring.application.name=api-gateway

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379

# Account Service Route
spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/accounts,/api/v1/accounts/**,/api/v1/auth,/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20

# Transaction Service Route
spring.cloud.gateway.server.webflux.routes[1].id=transaction-service
spring.cloud.gateway.server.webflux.routes[1].uri=${TRANSACTION_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/transactions,/api/v1/transactions/**

spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=20

# OpenAPI document routes
spring.cloud.gateway.server.webflux.routes[2].id=account-service-openapi
spring.cloud.gateway.server.webflux.routes[2].uri=${ACCOUNT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/account-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=transaction-service-openapi
spring.cloud.gateway.server.webflux.routes[3].uri=${TRANSACTION_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/transaction-service/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

# Server
server.port=8080

# Swagger UI aggregation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Account Service
springdoc.swagger-ui.urls[0].url=/account-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Transaction Service
springdoc.swagger-ui.urls[1].url=/transaction-service/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only

# Development CORS for browser clients using the gateway.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000,http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*

# JWT Secret
jwt.secret=${JWT_SECRET}

